name: Render Hindi Tree Growth Explainer
on:
  push:
    branches:
      - video/tree-growth-explainer
    paths:
      - "video-project/**"
      - ".github/workflows/render-tree-growth.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: video-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-project/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering tools and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Install Pocket TTS Hindi
        run: |
          git clone --depth 1 https://github.com/builderAbhishek/pocket-tts-hindi.git ../pocket-tts-hindi
          python -m pip install --upgrade pip
          python -m pip install -e ../pocket-tts-hindi scipy huggingface_hub
      - name: Install Node dependencies
        run: npm install
      - name: Generate Pocket TTS Hindi narration and soft music
        run: bash scripts/tree-audio.sh
      - name: Render educational MP4
        run: npm run render:tree
      - uses: actions/upload-artifact@v4
        with:
          name: tree-growth-hindi-explainer
          path: video-project/out/tree-growth-hindi.mp4
          retention-days: 14
