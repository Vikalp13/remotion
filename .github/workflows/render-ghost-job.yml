name: Render Hindi Comedy Short
on:
  push:
    branches:
      - video/ghost-job-short
    paths:
      - "video-project/**"
      - ".github/workflows/render-ghost-job.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-project/package.json
      - name: Install rendering and Hindi voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-noto-extra
      - name: Install Node dependencies
        run: npm install
      - name: Generate narration and music
        run: bash scripts/audio.sh
      - name: Render MP4
        run: npx remotion render src/index.jsx GhostJob out/ghost-job.mp4 --codec=h264 --crf=20
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-job-hindi-comedy-mp4
          path: video-project/out/ghost-job.mp4
          retention-days: 7
